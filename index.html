#table-boot::after {
  content:""; position:absolute; inset:calc(var(--edge) + 5px); pointer-events:none;
  --fillet:linear-gradient(#d8bc80c7,#d8bc80c7);
  background:var(--fillet) left top/5% 1px,var(--fillet) left top/1px 4%,
    var(--fillet) right top/5% 1px,var(--fillet) right top/1px 4%,
    var(--fillet) left bottom/5% 1px,var(--fillet) left bottom/1px 4%,
    var(--fillet) right bottom/5% 1px,var(--fillet) right bottom/1px 4%;
  background-repeat:no-repeat;
}
.boot-leaf {
  position:absolute; inset:0 auto 0 max(5.2%,env(safe-area-inset-left)); width:34.5%;
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  gap:clamp(18px,5.2vh,65px);
}
.boot-masthead { width:100%; }
.boot-device { display:flex; align-items:center; justify-content:center; gap:9px; margin-bottom:clamp(8px,1.8vh,19px); color:var(--gold); }
.boot-device::before,.boot-device::after {
  content:""; width:clamp(20px,3vw,48px); height:1px; background:linear-gradient(90deg,transparent,#a38351a8);
}
.boot-device::after { transform:scaleX(-1); }
.boot-device svg { width:clamp(32px,5.4vmin,70px); height:auto; display:block; }
#table-boot h1 {
  margin:0 -.085em 0 0; font:750 clamp(34px,6.2vw,102px)/1.18 "Opening Kai","Kaiti SC",KaiTi,serif;
  letter-spacing:.085em; white-space:nowrap; text-shadow:0 1px #fceacb;
}
.boot-script { display:block; font:400 clamp(30px,5.5vw,89px)/1.05 "Opening Lettering",cursive; color:#745035; }
.boot-progress {
  position:relative; display:grid; align-content:center; width:clamp(138px,77%,212px);
  height:calc(92px + clamp(50px,9vmin,71px)); color:#51402f;
}
.boot-track {
  --loaded:0%; position:relative; height:2px; margin:0 4px; background:#b59a70;
  box-shadow:0 1px 0 #fff1cebf;
}
#boot-fill {
  display:block; width:100%; height:100%; transform:scaleX(0); transform-origin:left;
  background:linear-gradient(90deg,#38545a,#598289);
}
.boot-track::before,.boot-track::after {
  content:""; position:absolute; left:var(--loaded); top:50%; width:8px; height:8px;
  transform:translate(-50%,-50%) rotate(45deg);
}
.boot-track::after {
  border:1px solid #876a44;
  background:conic-gradient(from 45deg,#e6efe0 0 25%,#6f9295 25% 50%,#adc6bf 50% 75%,#f5edd5 75%);
  box-shadow:0 0 0 1px #f6e6c3;
}
.boot-track::before { opacity:0; box-shadow:0 0 5px 2px #ffecb1; animation:boot-gleam 3.8s ease-in-out infinite; }
@keyframes boot-gleam { 0%,28%,100% { opacity:0; } 56% { opacity:.82; } }
.boot-line { display:flex; align-items:baseline; justify-content:center; gap:8px; margin:11px 2px 0; text-shadow:0 1px #fbebce; }
#boot-label { font:500 clamp(13px,1.8vmin,16px)/1.35 "Opening Kai","Kaiti SC",KaiTi,serif; letter-spacing:.045em; }
#boot-percent { min-width:4ch; text-align:left; color:#3f514e; font:15px/1.2 Georgia,"Times New Roman",serif; font-variant-numeric:tabular-nums; }
#boot-retry {
  justify-self:center; margin-top:9px; min-height:40px; padding:5px 18px; border:1px solid #aa8955;
  background:#354f58; color:#fff0ce; font:inherit; cursor:pointer;
}
#boot-retry:focus-visible { outline:2px solid #385962; outline-offset:2px; }
#model-progress { box-sizing:border-box; position:fixed; z-index:80; left:50%; top:max(5px,env(safe-area-inset-top)); transform:translateX(-50%);
  width:max-content; max-width:90vw; border:1px solid #9a845f; border-radius:3px; background:#f1e5cb;
  color:#364c54; box-shadow:0 1px 4px #493d2a55; padding:4px 10px; font:13px Georgia,"Songti SC","SimSun",serif; pointer-events:none; }
@media (min-aspect-ratio:2/1) {
  .boot-leaf { left:max(7%,env(safe-area-inset-left)); width:32%; gap:clamp(10px,3vh,25px); }
  .boot-device { margin-bottom:4px; } .boot-device svg { width:clamp(26px,7.2vh,52px); }
  #table-boot h1 { font-size:clamp(31px,12vh,84px); } .boot-script { font-size:clamp(27px,9.7vh,68px); }
}
@media (orientation:portrait) {
  #table-boot .boot-art {
    bottom:auto; height:59%; background-position:78% 27%;
    -webkit-mask-image:linear-gradient(#000 74%,transparent); mask-image:linear-gradient(#000 74%,transparent);
  }
  .boot-leaf {
    inset:47% max(6%,env(safe-area-inset-right)) max(3%,env(safe-area-inset-bottom)) max(6%,env(safe-area-inset-left));
    width:auto; gap:clamp(12px,2vh,26px);
  }
  .boot-device { gap:8px; margin-bottom:4px; } .boot-device svg { width:clamp(23px,4.5vh,43px); }
  #table-boot h1 { font-size:clamp(39px,10vw,84px); } .boot-script { font-size:clamp(31px,8.5vw,65px); }
  .boot-progress { width:clamp(152px,44vw,215px); }
}
@media (max-aspect-ratio:2/3) and (max-height:740px), (orientation:portrait) and (max-width:405px) and (max-height:610px) {
  #table-boot { display:flex; flex-direction:column; }
  #table-boot .boot-art { position:relative; inset:auto; flex:1; min-height:0; height:auto; margin:var(--edge) var(--edge) 0; }
  .boot-leaf { position:relative; inset:auto; flex:none; gap:clamp(6px,1.8dvh,12px);
    margin:0 max(6%,env(safe-area-inset-right)) max(10px,2dvh,env(safe-area-inset-bottom)) max(6%,env(safe-area-inset-left)); }
}
@media (orientation:portrait) and (min-aspect-ratio:2/3) {

      const controller = new AbortController();
      const stop = () => controller.abort();
      signal.addEventListener("abort",stop,{once:true});
      let timer;
      const heartbeat = () => { clearTimeout(timer); timer=setTimeout(stop,20000); };
      try {
        if (signal.aborted) throw new Error("已取消");
        heartbeat();
        const hit = !attempt && await cached("readonly",store=>store.get(file.file));
        const response = hit ? null : await fetch(url,{signal:controller.signal,cache:attempt?"reload":"force-cache"});
        if (response && !response.ok) throw new Error("资源未送达");
        let bytes;
        if (response?.body?.getReader) {
          const reader=response.body.getReader();
          bytes=new Uint8Array(file.bytes);
          let offset=0;
          for (;;) {
            const {done,value}=await reader.read();
            if (done) break;
            if (offset+value.length>bytes.length) { await reader.cancel(); throw new Error("资源长度有误"); }
            bytes.set(value,offset); offset+=value.length;
            report(offset); heartbeat();
          }
          if (offset!==bytes.length) throw new Error("资源未收齐");
        } else {
          bytes=new Uint8Array(hit ? hit.data : await response.arrayBuffer());
          if (bytes.length!==file.bytes) throw new Error("资源未收齐");
          report(bytes.length);
        }
        const hash=Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",bytes)),n=>n.toString(16).padStart(2,"0")).join("");
        if (!file.file.startsWith(hash+".")) throw new Error("资源校验失败");
        if (!hit) await cached("readwrite",store=>store.put({data:bytes.buffer,stored:Date.now()},file.file));
        return bytes;
      } catch (error) {
        report(0);
        if (signal.aborted || attempt) throw error;
      } finally {
        stop(); clearTimeout(timer); signal.removeEventListener("abort",stop);
      }
    }
  }

  async function loadFiles(files,onProgress) {
    const controller=new AbortController(), parts=new Array(files.length), counts=files.map(()=>0);
    const total=files.reduce((n,f)=>n+f.bytes,0);
    let cursor=0, received=0;
    async function lane() {
      while (!controller.signal.aborted && cursor<files.length) {
        const i=cursor++;
        parts[i]=await readFile(files[i],controller.signal,n=>{
          received+=n-counts[i]; counts[i]=n;
          onProgress(Math.min(99,Math.floor(100*received/total)));
        });
      }
    }
    const lanes=Array.from({length:Math.min(4,files.length)},lane);
    try { await Promise.all(lanes); }
    catch (error) { controller.abort(); await Promise.allSettled(lanes); throw error; }
    return parts;
  }

  const modelBadge=byId("model-progress");
  let modelJob=null, modelAssets=null, modelPercent=-1, badgeTimer;
  function hideModel() { clearTimeout(badgeTimer); modelBadge.hidden=true; }
  function updateModel(n) {
    if (n===modelPercent) return;
    modelPercent=n; modelBadge.textContent="正在准备困难棋手 · "+n+"%";
  }
  async function readModel() {
    const config=JSON.parse(byId("neural-assets").textContent);
    const entries=Object.entries(map.model);
    const blocks=await loadFiles(entries.flatMap(([,files])=>files),updateModel);
    let i=0;
    for (const [key,files] of entries) {
      const bytes=new Uint8Array(files.reduce((n,f)=>n+f.bytes,0));
      let offset=0;
      for (const file of files) { bytes.set(blocks[i++],offset); offset+=file.bytes; }
      if (config[key]) config[key].data=bytes;
      else config[key]=bytes;
    }
    modelAssets=config;
    updateModel(100);
  }
  globalThis.TableDownloads=Object.freeze({
    get neuralAssets(){return modelAssets;},
    prepareModel(){
      clearTimeout(badgeTimer);
      badgeTimer=setTimeout(()=>{modelBadge.hidden=false;},250);
      if (!modelJob) {
        updateModel(0);
        modelJob=readModel().finally(()=>{modelJob=null;hideModel();});
      }
      return modelJob;
    },
    hideModel
  });

  async function boot() {
    const panel=byId("table-boot"), fill=byId("boot-fill"), value=byId("boot-percent");
    const track=fill.parentElement;
    let percent=-1;
    function progress(n) {
      if (percent===n) return;
      percent=n;value.textContent=n+"%";fill.style.transform="scaleX("+n/100+")";
      track.style.setProperty("--loaded",n+"%");
      track.setAttribute("aria-valuenow",n);
    }
    await nextFrame();
    const blocks=await loadFiles(map.files,progress);
    byId("boot-label").textContent="正在就位";
    await nextFrame();
    const media=map.media.map(([i,start,size,type])=>URL.createObjectURL(new Blob([blocks[i].subarray(start,start+size)],{type})));
    const entries=JSON.parse(new TextDecoder().decode(blocks[0]));
    document.body.append(byId("game-layout").content);
    let startupError;
    const onError=e=>{startupError=e.message || "棋桌未能启动";};
    window.addEventListener("error",onError);
    try {
      for (const entry of entries) {
        const el=document.createElement(entry.tag);
        if (entry.id) el.id=entry.id;
        if (entry.type) el.type=entry.type;
        if (entry.audio) el.dataset.audioUrl=new URL(entry.audio,base).href;
        el.textContent=entry.text.replace(/__TABLE_MEDIA_(\d+)__/g,(_,i)=>media[i]);
        (entry.tag==="style" ? document.head : document.body).append(el);
        if (startupError) throw new Error(startupError);
      }
    } finally {window.removeEventListener("error",onError);}
    if (!globalThis.Table) throw new Error("棋桌未能启动");
    await nextFrame(); await document.fonts.ready;
    progress(100);
    await nextFrame();
    const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
    const masthead=panel.querySelector(".boot-masthead");
    const coverTitle=document.querySelector("#game-cover:not([hidden]) .cover-masthead");
    if (!reduced && coverTitle && masthead.animate) {
      // A saved game or a different player mode changes the height of the cover menu.
      // Keep both impressions of the lettering together through the dissolve.
      const dy=coverTitle.getBoundingClientRect().top-masthead.getBoundingClientRect().top;
      if (Math.abs(dy)>1) {
        const timing={duration:280,easing:"ease-out"};
        masthead.animate([{transform:"none"},{transform:"translateY("+dy+"px)"}],{...timing,fill:"forwards"});
        coverTitle.animate([{transform:"translateY("+(-dy)+"px)"},{transform:"none"}],timing);
      }
    }
    panel.classList.add("leaving");
    setTimeout(()=>panel.remove(),reduced?0:290);
    // Give other open versions time to finish their downloads before retiring old assets.
    const keep=new Set([...map.files,...Object.values(map.model).flat()].map(f=>f.file));
    cached("readwrite",store=>{
      const req=store.index("stored").openKeyCursor(IDBKeyRange.upperBound(Date.now()-14*86400000));
      req.onsuccess=()=>{
        const cursor=req.result;
        if (!cursor) return;
        if (!keep.has(cursor.primaryKey)) store.delete(cursor.primaryKey);
        cursor.continue();
      };
      return req;
    });
  }
  boot().catch(error=>{
    console.warn("Table loading:",error);
    byId("boot-label").textContent="加载中断，请重试";
    const retry=byId("boot-retry"); retry.hidden=false; retry.onclick=()=>location.reload();
  });
})();
</script>
</body></html>
